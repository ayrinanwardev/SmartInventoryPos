spring.application.name=SmartInventoryPOS
server.port=8080

# PostgreSQL. The password comes from backend/application.properties (not in git),
# which Spring reads when started from the backend folder, or from DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/pos
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. A database that predates Flyway is marked as version 1 without running V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
# validate = check the tables match at startup, and never change them.
spring.jpa.hibernate.ddl-auto=validate
# Responses are built inside service transactions, so the session need not stay open for the web layer.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Loads sale items in batches rather than with one query per sale.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
