spring.application.name=SmartInventoryPOS
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Secrets and connection details come from the environment, or from a .env file
# (never committed; copy .env.example). Both the backend folder and the project
# root are checked, so it works from Gradle and from an Android Studio run config.
# backend/application.properties (also never committed) is read too, and wins over .env.
# It is imported explicitly so it also works when the IDE starts the app from the project root.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:backend/application.properties

# ---------------------------------------------------------------------------
# Database: Supabase (hosted PostgreSQL) or a local PostgreSQL.
# Defaults point at a local database, so nothing changes until DB_URL is set.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# Driver options go in DB_URL itself (see .env.example), e.g. ?sslmode=require for Supabase.
# Keeping them in the URL means the H2 test database never sees PostgreSQL-only settings.

# Connection pool. Supabase plans cap total connections, so stay small.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
# Routers and the Supabase pooler silently drop idle connections (seen after ~2 min).
# Ping idle connections every 30 s and recycle them every 5 min, so a request never gets a dead one.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# ---------------------------------------------------------------------------
# Flyway owns the schema. A database that predates Flyway is marked as version 1 without running V1.
# db/vendor/{vendor} holds PostgreSQL-only scripts (Supabase API lock-down) that the H2 tests skip.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
# validate = check the tables match at startup, and never change them.
spring.jpa.hibernate.ddl-auto=validate
# Responses are built inside service transactions, so the session need not stay open for the web layer.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Loads sale items in batches rather than with one query per sale.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
