name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages follow the protocol
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit on this branch
        run: |
          pattern='^(feat|fix|test|refactor|perf|docs|build|ci|chore)(\([a-z0-9-]+\))?: .+ \(#[0-9]+\)$'
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit message doesn't follow CONTRIBUTING.md: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $bad

  backend:
    name: Backend tests (incl. PostgreSQL concurrency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run backend tests
        run: ./gradlew :backend:test --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  app:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
